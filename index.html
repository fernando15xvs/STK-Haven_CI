<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090A0C">
  <title>STK Haven</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#090A0C;color:#F4F4F5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:520px;padding:32px;text-align:center}
    h1{margin:0 0 12px;font-size:32px}
    p{margin:0;color:#A1A1AA;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <h1>STK Haven</h1>
    <p>La versión web fue retirada. STK Haven continúa como aplicación móvil.</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => Promise.all(registrations.map((r) => r.unregister())))
        .catch(() => {});
    }
    if ('caches' in window) {
      caches.keys()
        .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
        .catch(() => {});
    }
  </script>
</body>
</html>
