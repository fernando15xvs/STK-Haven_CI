name: gym_tracker
description: "STK Haven - entrenamiento, progreso y bienestar personal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  flutter_riverpod: ^3.3.2
  uuid: ^4.6.0
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  # Pinned to preserve Android API 23 support; newer image_picker Android implementations require API 24+.
  image_picker: 1.1.2
  image_picker_android: 0.8.12+23
  sqflite: ^2.4.2+1
  path: ^1.9.1
  workmanager: ^0.10.7
  http: ^1.6.0
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  csv: ^8.0.0
  path_provider: ^2.1.6
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/imagenes/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/imagenes/app_icon_master.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#090A0C"
  adaptive_icon_foreground: "assets/imagenes/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 16

flutter_native_splash:
  color: "#090A0C"
  image: "assets/imagenes/iconlogo.png"
  android: true
  ios: true
  android_12:
    color: "#090A0C"
    image: "assets/imagenes/iconlogo_square.png"
