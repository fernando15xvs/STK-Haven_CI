<!DOCTYPE html>
<html>
<head>
  <!--
    The placeholder below is replaced by Flutter's --base-href value.
    Relative PWA resources keep GitHub Pages deployments working under a
    repository sub-path.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="STK Haven: entrenamiento, progreso y bienestar personal.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090A0C">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="STK Haven">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/stk-haven-180.png">

  <link rel="icon" type="image/png" sizes="64x64" href="favicon-stk-haven.png">
  <link rel="manifest" href="manifest.json">
  <title>STK Haven</title>

  <style id="splash-screen-style">
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #090A0C;
    }

    body {
      overflow: hidden;
      touch-action: none;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      font-family: Outfit, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090A0C;
      color: #F0F0F3;
      opacity: 1;
      transition: opacity 800ms ease;
    }

    #splash.splash-exit {
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(30px);
      animation: splash-enter 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) 300ms forwards;
    }

    .splash-logo-wrap {
      width: min(82vw, 287px);
    }

    .splash-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .splash-title {
      margin-top: 20px;
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 1.5px;
    }

    .splash-subtitle {
      margin-top: 5px;
      padding: 0 20px;
      color: #BDBDBD;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 2px;
      text-align: center;
    }

    .splash-loader {
      width: 20px;
      height: 20px;
      margin-top: 50px;
      border: 2.5px solid rgba(41, 98, 255, 0.20);
      border-top-color: #2962FF;
      border-radius: 50%;
      animation: splash-spin 850ms linear infinite;
    }

    .splash-footer {
      position: absolute;
      right: 0;
      bottom: 30px;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #BDBDBD;
      opacity: 0;
      animation: splash-fade 2s ease 300ms forwards;
    }

    .splash-version {
      font-size: 11px;
      font-weight: 400;
      line-height: 1.3;
    }

    .splash-brand {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.8px;
    }

    @keyframes splash-enter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splash-fade {
      to { opacity: 1; }
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash {
        transition: none;
      }

      .splash-content,
      .splash-footer {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>

  <script id="splash-screen-script">
    const STK_SPLASH_MIN_MS = 3000;
    const STK_SPLASH_FADE_MS = 800;
    const stkSplashStartedAt = performance.now();
    let stkFlutterReady = false;
    let stkSplashExitScheduled = false;

    function finishSplashWhenReady() {
      if (!stkFlutterReady || stkSplashExitScheduled) return;
      stkSplashExitScheduled = true;

      const elapsed = performance.now() - stkSplashStartedAt;
      const remaining = Math.max(0, STK_SPLASH_MIN_MS - elapsed);

      window.setTimeout(() => {
        const splash = document.getElementById('splash');
        if (!splash) return;

        splash.classList.add('splash-exit');

        window.setTimeout(() => {
          splash.remove();
          document.body.style.background = 'transparent';
        }, STK_SPLASH_FADE_MS);
      }, remaining);
    }

    // This is the only visible web splash. Flutter renders WebLayout behind it.
    // Once the first Flutter frame exists, keep the splash only long enough to
    // reach the same ~3 second presentation used by the mobile experience.
    window.addEventListener('flutter-first-frame', () => {
      stkFlutterReady = true;
      finishSplashWhenReady();
    }, { once: true });
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <img class="splash-logo" src="splash/slf_logo.png" alt="">
      </div>
      <div class="splash-title">STK Haven</div>
      <div class="splash-subtitle">Tu compañero de entrenamiento</div>
      <div class="splash-loader"></div>
    </div>

    <div class="splash-footer">
      <div class="splash-version">Versión 1.0.0</div>
      <div class="splash-brand">SLF 2026</div>
    </div>
  </div>

  <script>
    // Browser Back is intentionally disabled for STK Haven Web/PWA.
    // Navigation inside the app must use Flutter's own back arrows/buttons.
    //
    // Safari's edge-swipe is browser chrome and cannot be physically removed
    // by a web page on every iOS version. This same-document guard makes the
    // gesture a no-op: it never changes Flutter routes and never leaves/reloads
    // the app.
    let stkHistoryGuardReady = false;

    window.stkHistoryInitialize = () => {
      if (stkHistoryGuardReady) return;

      const current =
        history.state && typeof history.state === 'object'
          ? history.state
          : {};

      history.replaceState(
        { ...current, stkHavenRoot: true },
        '',
        location.href,
      );
      history.pushState(
        { stkHavenBackGuard: true },
        '',
        location.href,
      );
      stkHistoryGuardReady = true;
    };

    window.addEventListener('popstate', (event) => {
      if (!stkHistoryGuardReady) return;

      // Consume browser Back before Flutter Web can interpret the same event.
      // Recreate the guard immediately so repeated swipes/back presses remain
      // blocked. Flutter's in-app arrow uses Navigator.pop() and does not touch
      // browser history, so it keeps working normally.
      event.stopImmediatePropagation();
      history.pushState(
        { stkHavenBackGuard: true },
        '',
        location.href,
      );
    });

    // Keep Flutter's physical view full-sized. The virtual keyboard must be
    // represented as a visual-viewport inset, not as a permanent resize of the
    // document. Mobile WebKit can otherwise leave the canvas at the keyboard
    // height for a frame (or until the next tap) after Done is pressed.
    const stkVisualViewport = window.visualViewport;
    let stkKeyboardViewportActive = false;
    let stkViewportRecoveryTimers = [];
    let stkStableViewportHeight = Math.max(
      document.documentElement.clientHeight,
      window.innerHeight,
      stkVisualViewport?.height ?? 0,
    );

    function stkIsEditable(element) {
      if (!(element instanceof HTMLElement)) return false;
      const tag = element.tagName;
      return tag === 'INPUT' ||
        tag === 'TEXTAREA' ||
        element.isContentEditable;
    }

    function stkResetRootScroll() {
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      window.scrollTo(0, 0);
    }

    function stkNotifyFlutterViewport() {
      stkResetRootScroll();
      // Reading the root height commits the style change before Flutter's
      // resize listener asks the browser for the new metrics.
      void document.documentElement.offsetHeight;
      window.dispatchEvent(new Event('resize'));
    }

    function stkSyncKeyboardViewport() {
      if (!stkKeyboardViewportActive || !stkVisualViewport) return;

      window.requestAnimationFrame(() => {
        if (!stkKeyboardViewportActive) return;
        const height = Math.round(stkVisualViewport.height);
        if (height <= 0) return;

        document.documentElement.style.height = `${height}px`;
        document.body.style.height = `${height}px`;
        stkNotifyFlutterViewport();
      });
    }

    function stkCancelViewportRecoveryTimers() {
      stkViewportRecoveryTimers.forEach((timer) => {
        window.clearTimeout(timer);
      });
      stkViewportRecoveryTimers = [];
    }

    function stkRecoverFullViewport() {
      stkKeyboardViewportActive = false;
      stkVisualViewport?.removeEventListener(
        'resize',
        stkSyncKeyboardViewport,
      );

      // Use the pre-keyboard height immediately. Waiting for Safari's delayed
      // visualViewport update is what exposes the black keyboard-sized gap.
      if (stkStableViewportHeight > 0) {
        const height = `${Math.round(stkStableViewportHeight)}px`;
        document.documentElement.style.height = height;
        document.body.style.height = height;
      }

      // WebKit reports the final viewport late when Safari's bottom toolbar is
      // visible. Notify Flutter now and at the end of that closing animation.
      stkCancelViewportRecoveryTimers();
      window.requestAnimationFrame(stkNotifyFlutterViewport);
      [80, 180, 360, 600].forEach((delay) => {
        stkViewportRecoveryTimers.push(
          window.setTimeout(stkNotifyFlutterViewport, delay),
        );
      });
      stkViewportRecoveryTimers.push(
        window.setTimeout(() => {
          document.documentElement.style.removeProperty('height');
          document.body.style.removeProperty('height');
          window.requestAnimationFrame(stkNotifyFlutterViewport);
        }, 700),
      );
    }

    document.addEventListener(
      'focusin',
      (event) => {
        if (!stkIsEditable(event.target) || !stkVisualViewport) return;

        stkCancelViewportRecoveryTimers();
        stkStableViewportHeight = Math.max(
          document.documentElement.clientHeight,
          window.innerHeight,
          stkVisualViewport.height,
        );
        stkKeyboardViewportActive = true;
        // Re-register for every editing session. WebKit can stop delivering
        // this listener after a software-keyboard lifecycle.
        stkVisualViewport.removeEventListener(
          'resize',
          stkSyncKeyboardViewport,
        );
        stkVisualViewport.addEventListener(
          'resize',
          stkSyncKeyboardViewport,
          { passive: true },
        );
        stkSyncKeyboardViewport();
      },
      true,
    );

    document.addEventListener(
      'focusout',
      () => {
        window.setTimeout(() => {
          // Moving directly between set fields must keep keyboard tracking on.
          if (stkIsEditable(document.activeElement)) return;
          stkRecoverFullViewport();
        }, 0);
      },
      true,
    );

    window.stkRecoverKeyboardViewport = stkRecoverFullViewport;
    window.addEventListener('pageshow', () => {
      stkStableViewportHeight = Math.max(
        document.documentElement.clientHeight,
        window.innerHeight,
        stkVisualViewport?.height ?? 0,
      );
      stkRecoverFullViewport();
    });
    window.addEventListener('orientationchange', () => {
      window.setTimeout(() => {
        stkStableViewportHeight = Math.max(
          document.documentElement.clientHeight,
          window.innerHeight,
          stkVisualViewport?.height ?? 0,
        );
        stkRecoverFullViewport();
      }, 250);
    });

    function stkUrlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
    }

    window.stkWebPushSupport = async () => {
      const serviceWorker = 'serviceWorker' in navigator;
      const pushManager = 'PushManager' in window;
      let subscribed = false;
      if (serviceWorker && pushManager) {
        try {
          const registration = await navigator.serviceWorker.ready;
          subscribed = !!(await registration.pushManager.getSubscription());
        } catch (_) {}
      }
      return JSON.stringify({
        serviceWorker,
        pushManager,
        notifications: 'Notification' in window,
        permission: 'Notification' in window
          ? Notification.permission
          : 'unsupported',
        subscribed,
        standalone:
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true,
      });
    };

    window.stkWebPushSubscribe = async (vapidPublicKey) => {
      if (!('serviceWorker' in navigator) ||
          !('PushManager' in window) ||
          !('Notification' in window)) {
        throw new Error('Web Push no está soportado en este navegador.');
      }
      if (!vapidPublicKey) {
        throw new Error('WEB_PUSH_VAPID_PUBLIC_KEY no está configurada.');
      }

      let permission = Notification.permission;
      if (permission === 'default') {
        permission = await Notification.requestPermission();
      }
      if (permission !== 'granted') {
        throw new Error('Permiso de notificaciones no concedido.');
      }

      const registration = await navigator.serviceWorker.ready;
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: stkUrlBase64ToUint8Array(vapidPublicKey),
        });
      }
      return JSON.stringify(subscription.toJSON());
    };

    window.stkWebPushUnsubscribe = async () => {
      if (!('serviceWorker' in navigator)) return '';
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      if (!subscription) return '';
      const endpoint = subscription.endpoint || '';
      await subscription.unsubscribe();
      return endpoint;
    };

    let stkAudioContext = null;

    window.stkEnableWebAudio = async () => {
      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) return false;
      stkAudioContext = stkAudioContext || new AudioContextCtor();
      if (stkAudioContext.state === 'suspended') {
        await stkAudioContext.resume();
      }
      return stkAudioContext.state === 'running';
    };

    window.stkPlayAlarmTone = async () => {
      const enabled = await window.stkEnableWebAudio();
      if (!enabled || !stkAudioContext) return false;

      const now = stkAudioContext.currentTime;
      const gain = stkAudioContext.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
      gain.connect(stkAudioContext.destination);

      for (const [offset, frequency] of [[0, 880], [0.22, 988], [0.44, 1175]]) {
        const oscillator = stkAudioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, now + offset);
        oscillator.connect(gain);
        oscillator.start(now + offset);
        oscillator.stop(now + offset + 0.18);
      }
      return true;
    };

    const stkUnlockAudioOnce = () => {
      window.stkEnableWebAudio().catch(() => {});
    };
    window.addEventListener('pointerdown', stkUnlockAudioOnce, {
      once: true,
      passive: true,
    });
    window.addEventListener('keydown', stkUnlockAudioOnce, { once: true });

    window.stkRequestNotificationPermission = async () => {
      if (!('Notification' in window)) return 'unsupported';
      if (Notification.permission === 'granted' ||
          Notification.permission === 'denied') {
        return Notification.permission;
      }
      return await Notification.requestPermission();
    };

    window.stkShowForegroundNotification = async (title, body) => {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        return false;
      }
      const registration = await navigator.serviceWorker.ready;
      await registration.showNotification(title, {
        body,
        icon: 'icons/stk-haven-192.png',
        badge: 'icons/stk-haven-192.png',
        tag: 'stk-haven-foreground',
        data: { url: './' },
      });
      return true;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('sw.js', {
            scope: './',
            updateViaCache: 'none',
          });
          await registration.update();
        } catch (error) {
          console.warn('STK Haven service worker registration failed:', error);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
