<!DOCTYPE html>
<html>
<head>
  <!--
    The placeholder below is replaced by Flutter's --base-href value.
    Relative PWA resources keep GitHub Pages deployments working under a
    repository sub-path.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="STK Haven: entrenamiento, progreso y bienestar personal.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090A0C">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="STK Haven">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/stk-haven-180.png">

  <link rel="icon" type="image/png" sizes="64x64" href="favicon-stk-haven.png">
  <link rel="manifest" href="manifest.json">
  <title>STK Haven</title>

  <style id="splash-screen-style">
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #090A0C;
    }

    body {
      overflow: hidden;
      touch-action: none;
      overscroll-behavior-y: none;
      font-family: Outfit, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090A0C;
      color: #F0F0F3;
      opacity: 1;
      transition: opacity 800ms ease;
    }

    #splash.splash-exit {
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(30px);
      animation: splash-enter 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) 300ms forwards;
    }

    .splash-logo-wrap {
      width: min(82vw, 287px);
    }

    .splash-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .splash-title {
      margin-top: 20px;
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 1.5px;
    }

    .splash-subtitle {
      margin-top: 5px;
      padding: 0 20px;
      color: #BDBDBD;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 2px;
      text-align: center;
    }

    .splash-loader {
      width: 20px;
      height: 20px;
      margin-top: 50px;
      border: 2.5px solid rgba(41, 98, 255, 0.20);
      border-top-color: #2962FF;
      border-radius: 50%;
      animation: splash-spin 850ms linear infinite;
    }

    .splash-footer {
      position: absolute;
      right: 0;
      bottom: 30px;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #BDBDBD;
      opacity: 0;
      animation: splash-fade 2s ease 300ms forwards;
    }

    .splash-version {
      font-size: 11px;
      font-weight: 400;
      line-height: 1.3;
    }

    .splash-brand {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.8px;
    }

    @keyframes splash-enter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splash-fade {
      to { opacity: 1; }
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash {
        transition: none;
      }

      .splash-content,
      .splash-footer {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>

  <script id="splash-screen-script">
    const STK_SPLASH_MIN_MS = 3000;
    const STK_SPLASH_FADE_MS = 800;
    const stkSplashStartedAt = performance.now();
    let stkFlutterReady = false;
    let stkSplashExitScheduled = false;

    function finishSplashWhenReady() {
      if (!stkFlutterReady || stkSplashExitScheduled) return;
      stkSplashExitScheduled = true;

      const elapsed = performance.now() - stkSplashStartedAt;
      const remaining = Math.max(0, STK_SPLASH_MIN_MS - elapsed);

      window.setTimeout(() => {
        const splash = document.getElementById('splash');
        if (!splash) return;

        splash.classList.add('splash-exit');

        window.setTimeout(() => {
          splash.remove();
          document.body.style.background = 'transparent';
        }, STK_SPLASH_FADE_MS);
      }, remaining);
    }

    // This is the only visible web splash. Flutter renders WebLayout behind it.
    // Once the first Flutter frame exists, keep the splash only long enough to
    // reach the same ~3 second presentation used by the mobile experience.
    window.addEventListener('flutter-first-frame', () => {
      stkFlutterReady = true;
      finishSplashWhenReady();
    }, { once: true });
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <img class="splash-logo" src="splash/slf_logo.png" alt="">
      </div>
      <div class="splash-title">STK Haven</div>
      <div class="splash-subtitle">Tu compañero de entrenamiento</div>
      <div class="splash-loader"></div>
    </div>

    <div class="splash-footer">
      <div class="splash-version">Versión 1.0.0</div>
      <div class="splash-brand">SLF 2026</div>
    </div>
  </div>

  <script>
    // Keep Flutter's imperative Navigator stack synchronized with the browser
    // history used by Safari/iOS swipe-back and desktop Back/Forward.
    let stkFlutterBackHandler = null;
    let stkHistoryDepth = 0;
    let stkSuppressNextPop = false;

    window.stkSetFlutterBackHandler = (handler) => {
      stkFlutterBackHandler = handler;
    };

    window.stkHistoryInitialize = () => {
      stkHistoryDepth = 0;
      stkSuppressNextPop = false;
      const current = history.state && typeof history.state === 'object'
        ? history.state
        : {};
      history.replaceState(
        { ...current, stkHavenRoot: true, stkHavenDepth: 0 },
        '',
        location.href,
      );
    };

    window.stkHistoryRoutePushed = () => {
      stkHistoryDepth += 1;
      history.pushState(
        { stkHavenRoute: true, stkHavenDepth: stkHistoryDepth },
        '',
        location.href,
      );
    };

    window.stkHistoryRoutePopped = () => {
      if (stkHistoryDepth <= 0) return;
      stkHistoryDepth -= 1;
      stkSuppressNextPop = true;
      history.back();
    };

    window.addEventListener('popstate', (event) => {
      if (stkSuppressNextPop) {
        stkSuppressNextPop = false;
        // This history traversal was generated by Flutter after an in-app pop.
        // Flutter Web also listens to popstate; letting that listener run would
        // process the same Back action a second time and can rebuild the root
        // route on Inicio.
        event.stopImmediatePropagation();
        return;
      }
      if (stkHistoryDepth > 0 && stkFlutterBackHandler) {
        stkHistoryDepth -= 1;
        // The bridge owns app-managed history entries. Prevent Flutter Web's
        // own popstate listener from issuing a second Navigator pop.
        event.stopImmediatePropagation();
        stkFlutterBackHandler();
      }
    });

    function stkUrlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
    }

    window.stkWebPushSupport = async () => {
      const serviceWorker = 'serviceWorker' in navigator;
      const pushManager = 'PushManager' in window;
      let subscribed = false;
      if (serviceWorker && pushManager) {
        try {
          const registration = await navigator.serviceWorker.ready;
          subscribed = !!(await registration.pushManager.getSubscription());
        } catch (_) {}
      }
      return JSON.stringify({
        serviceWorker,
        pushManager,
        notifications: 'Notification' in window,
        permission: 'Notification' in window
          ? Notification.permission
          : 'unsupported',
        subscribed,
        standalone:
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true,
      });
    };

    window.stkWebPushSubscribe = async (vapidPublicKey) => {
      if (!('serviceWorker' in navigator) ||
          !('PushManager' in window) ||
          !('Notification' in window)) {
        throw new Error('Web Push no está soportado en este navegador.');
      }
      if (!vapidPublicKey) {
        throw new Error('WEB_PUSH_VAPID_PUBLIC_KEY no está configurada.');
      }

      let permission = Notification.permission;
      if (permission === 'default') {
        permission = await Notification.requestPermission();
      }
      if (permission !== 'granted') {
        throw new Error('Permiso de notificaciones no concedido.');
      }

      const registration = await navigator.serviceWorker.ready;
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: stkUrlBase64ToUint8Array(vapidPublicKey),
        });
      }
      return JSON.stringify(subscription.toJSON());
    };

    window.stkWebPushUnsubscribe = async () => {
      if (!('serviceWorker' in navigator)) return '';
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      if (!subscription) return '';
      const endpoint = subscription.endpoint || '';
      await subscription.unsubscribe();
      return endpoint;
    };

    let stkAudioContext = null;

    window.stkEnableWebAudio = async () => {
      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) return false;
      stkAudioContext = stkAudioContext || new AudioContextCtor();
      if (stkAudioContext.state === 'suspended') {
        await stkAudioContext.resume();
      }
      return stkAudioContext.state === 'running';
    };

    window.stkPlayAlarmTone = async () => {
      const enabled = await window.stkEnableWebAudio();
      if (!enabled || !stkAudioContext) return false;

      const now = stkAudioContext.currentTime;
      const gain = stkAudioContext.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
      gain.connect(stkAudioContext.destination);

      for (const [offset, frequency] of [[0, 880], [0.22, 988], [0.44, 1175]]) {
        const oscillator = stkAudioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, now + offset);
        oscillator.connect(gain);
        oscillator.start(now + offset);
        oscillator.stop(now + offset + 0.18);
      }
      return true;
    };

    const stkUnlockAudioOnce = () => {
      window.stkEnableWebAudio().catch(() => {});
    };
    window.addEventListener('pointerdown', stkUnlockAudioOnce, {
      once: true,
      passive: true,
    });
    window.addEventListener('keydown', stkUnlockAudioOnce, { once: true });

    window.stkShowForegroundNotification = async (title, body) => {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        return false;
      }
      const registration = await navigator.serviceWorker.ready;
      await registration.showNotification(title, {
        body,
        icon: 'icons/stk-haven-192.png',
        badge: 'icons/stk-haven-192.png',
        tag: 'stk-haven-foreground',
        data: { url: './' },
      });
      return true;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('sw.js', {
            scope: './',
            updateViaCache: 'none',
          });
          await registration.update();
        } catch (error) {
          console.warn('STK Haven service worker registration failed:', error);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
