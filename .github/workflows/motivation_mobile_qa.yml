name: STK Motivation mobile QA
on:
  push:
    branches:
      - feat/mobile-lottie-batch1-drafts-20261018
    paths:
      - apps/app_mobile/lib/features/motivation/**
      - apps/app_mobile/lib/shared/bootstrap/mobile_app_bootstrap.dart
      - apps/app_mobile/lib/features/profile/presentation/pages/profile_page.dart
      - apps/app_mobile/lib/features/home/presentation/pages/home_screen.dart
      - apps/app_mobile/lib/features/routines/presentation/pages/routines_page.dart
      - apps/app_mobile/lib/features/workout/presentation/active_workout_page_content.dart
      - apps/app_mobile/test/features/motivation/**
      - apps/app_mobile/pubspec.yaml
      - pubspec.lock
      - .github/workflows/motivation_mobile_qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motivation-flutter-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: Verify pinned workspace
        run: flutter pub get --enforce-lockfile
      - name: Analyze STK Motivation and mobile entrypoints
        run: |
          flutter analyze --no-fatal-infos \
            apps/app_mobile/lib/features/motivation \
            apps/app_mobile/lib/shared/bootstrap/mobile_app_bootstrap.dart \
            apps/app_mobile/lib/features/profile/presentation/pages/profile_page.dart \
            apps/app_mobile/lib/features/home/presentation/pages/home_screen.dart \
            apps/app_mobile/lib/features/routines/presentation/pages/routines_page.dart \
            apps/app_mobile/lib/features/workout/presentation/active_workout_page_content.dart
      - name: Test STK Motivation local library and compact workout player
        run: flutter test apps/app_mobile/test/features/motivation
      # Same production UI scope as the established public CI. Archived 3D
      # tests need generated GLBs and belong to the separate anatomical QA job.
      - name: Test existing mobile screens and workout behaviour
        working-directory: apps/app_mobile
        run: >-
          flutter test
          test/core
          test/features/workout
          test/features/progress
          test/measurement_progress_panel_test.dart
          test/muscle_balance_panel_test.dart
          test/progress_insights_panel_test.dart
          test/progress_unified_exercises_test.dart
          test/widget_test.dart
          test/features/exercises/advanced_exercise_filter_sheet_test.dart
          test/features/exercises/exercise_demonstration_card_test.dart
          test/features/exercises/exercise_selection_preview_test.dart
          test/features/exercises/muscle_hierarchy_picker_test.dart
          test/features/exercises/mobile_lottie_production_plan_test.dart
