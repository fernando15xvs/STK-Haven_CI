name: STK Haven Mobile — Measurement Map QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/app_mobile/lib/features/progress/**'
      - 'apps/app_mobile/test/features/progress/body_measurement_silhouette_test.dart'
      - 'apps/app_mobile/test/measurement_progress_panel_test.dart'
      - 'packages/core/lib/domain/models/body_measurement.dart'
      - '.github/workflows/measurement_map_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measurement-map-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measurement-map:
    name: Measurement silhouette Flutter QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: Resolve pinned workspace
        run: flutter pub get --enforce-lockfile
      - name: Analyze modified measurement widgets
        run: >-
          flutter analyze --no-fatal-infos
          apps/app_mobile/lib/features/progress/presentation/widgets/body_measurement_silhouette.dart
          apps/app_mobile/lib/features/progress/presentation/pages/body_measurement_page.dart
          apps/app_mobile/lib/features/progress/presentation/pages/measurement_progress_panel.dart
      - name: Test saved values, both silhouettes, 320px, dark/light, existing trends
        working-directory: apps/app_mobile
        run: >-
          flutter test --reporter expanded
          test/features/progress/body_measurement_silhouette_test.dart
          test/measurement_progress_panel_test.dart
      - name: Upload actual Flutter front/back screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stk-haven-measurement-silhouettes-qa
          path: apps/app_mobile/build/measurement_silhouette_qa/*.png
          if-no-files-found: warn
          retention-days: 14
