name: STK Haven Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.9"

jobs:
  analyze-and-core:
    name: Analyze + Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: Verify dependency snapshot is clean
        run: |
          git diff --exit-code -- \
            pubspec.lock \
            apps/app_mobile/linux/flutter/generated_plugin_registrant.cc \
            apps/app_mobile/linux/flutter/generated_plugin_registrant.h \
            apps/app_mobile/linux/flutter/generated_plugins.cmake \
            apps/app_mobile/macos/Flutter/GeneratedPluginRegistrant.swift \
            apps/app_mobile/windows/flutter/generated_plugin_registrant.cc \
            apps/app_mobile/windows/flutter/generated_plugin_registrant.h \
            apps/app_mobile/windows/flutter/generated_plugins.cmake
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Core tests
        working-directory: packages/core
        run: flutter test

  supabase-db:
    name: Supabase DB + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: v2.118.0
      - name: Stage post-Roadmap 2 migrations for upgrade test
        run: |
          mkdir -p /tmp/stk-post-roadmap2-migrations
          for migration in supabase/migrations/*.sql; do
            case "$(basename "$migration")" in
              20260821101400_add_haven_faith_rate_limit.sql|20260821101537_document_haven_faith_rate_limit_rls.sql|20260902203000_stk_haven_cloud_backups.sql) ;;
              *) mv "$migration" /tmp/stk-post-roadmap2-migrations/ ;;
            esac
          done
          echo "Roadmap 2 baseline migrations:"
          ls -1 supabase/migrations
          echo "Roadmap 3/4 staged migrations:"
          ls -1 /tmp/stk-post-roadmap2-migrations
      - name: Start isolated Supabase at Roadmap 2 baseline
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Rebuild Roadmap 2 baseline
        run: supabase db reset
      - name: Restore Roadmap 3/4 migrations
        run: mv /tmp/stk-post-roadmap2-migrations/*.sql supabase/migrations/
      - name: Upgrade Roadmap 2 through Roadmap 4 incrementally
        run: supabase migration up --local
      - name: Run pgTAP after incremental upgrade
        run: supabase test db
      - name: Rebuild fresh database from all migrations
        run: supabase db reset
      - name: Run pgTAP after clean rebuild
        run: supabase test db
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  edge-functions:
    name: Edge Functions static check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: >-
          deno check
          supabase/functions/food-vision-ai/index.ts
          supabase/functions/web-push-test/index.ts

  mobile-tests:
    name: Mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Test mobile
        working-directory: apps/app_mobile
        run: flutter test

  android:
    name: Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      # Hosted Ubuntu includes toolchains unrelated to this Android build.
      # Gradle/Flutter can exhaust the workspace when debug, profile, release,
      # appbundle and split-ABI outputs are built in the same runner.
      - name: Reclaim Android runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          # Keep the Android SDK/NDK, Java and Flutter tooling intact.
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "Disk after cleanup:"
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build debug APK
        working-directory: apps/app_mobile
        run: flutter build apk --debug --target lib/main_android.dart
      - name: Build profile APK
        working-directory: apps/app_mobile
        run: flutter build apk --profile --target lib/main_android.dart
      - name: Build release APK
        working-directory: apps/app_mobile
        run: flutter build apk --release --target lib/main_android.dart
      - name: Build release AAB
        working-directory: apps/app_mobile
        run: flutter build appbundle --release --target lib/main_android.dart
      - name: Build split ABI APKs
        working-directory: apps/app_mobile
        run: flutter build apk --release --split-per-abi --target lib/main_android.dart

  ios:
    name: iOS release + profile
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Install CocoaPods
        working-directory: apps/app_mobile/ios
        run: pod install
      - name: Build iOS release without signing
        working-directory: apps/app_mobile
        run: flutter build ios --release --no-codesign --target lib/main_ios.dart
      - name: Build iOS profile without signing
        working-directory: apps/app_mobile
        run: flutter build ios --profile --no-codesign --target lib/main_ios.dart
      - name: Package unsigned iOS IPA
        working-directory: apps/app_mobile
        run: |
          rm -rf build/ios_personal_test
          mkdir -p build/ios_personal_test/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios_personal_test/Payload/
          cd build/ios_personal_test
          /usr/bin/zip -qry STK-Haven-unsigned.ipa Payload
          shasum -a 256 STK-Haven-unsigned.ipa > STK-Haven-unsigned.ipa.sha256
      - name: Upload unsigned iOS personal-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: stk-haven-ios-unsigned
          path: |
            apps/app_mobile/build/ios_personal_test/STK-Haven-unsigned.ipa
            apps/app_mobile/build/ios_personal_test/STK-Haven-unsigned.ipa.sha256
          retention-days: 7
          if-no-files-found: error
