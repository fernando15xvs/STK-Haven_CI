name: STK Haven Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.9"

jobs:
  analyze-and-core:
    name: Analyze + Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Core tests
        working-directory: packages/core
        run: flutter test

  mobile-tests:
    name: Mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Test mobile
        working-directory: apps/app_mobile
        run: flutter test

  android:
    name: Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build debug APK
        working-directory: apps/app_mobile
        run: flutter build apk --debug --target lib/main_android.dart
      - name: Build profile APK
        working-directory: apps/app_mobile
        run: flutter build apk --profile --target lib/main_android.dart
      - name: Build release APK
        working-directory: apps/app_mobile
        run: flutter build apk --release --target lib/main_android.dart
      - name: Build release AAB
        working-directory: apps/app_mobile
        run: flutter build appbundle --release --target lib/main_android.dart
      - name: Build split ABI APKs
        working-directory: apps/app_mobile
        run: flutter build apk --release --split-per-abi --target lib/main_android.dart

  web:
    name: Web tests + builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Web tests
        working-directory: apps/app_web
        run: flutter test
      - name: Build dart2js release
        working-directory: apps/app_web
        run: flutter build web --release
      - name: Build WASM comparison
        working-directory: apps/app_web
        run: flutter build web --release --wasm

  ios:
    name: iOS release + profile
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Install CocoaPods
        working-directory: apps/app_mobile/ios
        run: pod install
      - name: Build iOS release without signing
        working-directory: apps/app_mobile
        run: flutter build ios --release --no-codesign --target lib/main_ios.dart
      - name: Build iOS profile without signing
        working-directory: apps/app_mobile
        run: flutter build ios --profile --no-codesign --target lib/main_ios.dart
