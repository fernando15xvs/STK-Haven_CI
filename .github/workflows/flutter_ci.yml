name: STK Haven Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.9"

jobs:
  analyze-and-core:
    name: Analyze + Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: Verify dependency snapshot is clean
        run: |
          git diff --exit-code -- \
            pubspec.lock \
            apps/app_mobile/linux/flutter/generated_plugin_registrant.cc \
            apps/app_mobile/linux/flutter/generated_plugin_registrant.h \
            apps/app_mobile/linux/flutter/generated_plugins.cmake \
            apps/app_mobile/macos/Flutter/GeneratedPluginRegistrant.swift \
            apps/app_mobile/windows/flutter/generated_plugin_registrant.cc \
            apps/app_mobile/windows/flutter/generated_plugin_registrant.h \
            apps/app_mobile/windows/flutter/generated_plugins.cmake
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Core tests
        working-directory: packages/core
        run: flutter test

  supabase-db:
    name: Supabase DB + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: v2.118.0
      - name: Stage post-Roadmap 2 migrations for upgrade test
        run: |
          mkdir -p /tmp/stk-post-roadmap2-migrations
          for migration in supabase/migrations/*.sql; do
            case "$(basename "$migration")" in
              20260821101400_add_haven_faith_rate_limit.sql|20260821101537_document_haven_faith_rate_limit_rls.sql|20260902203000_stk_haven_cloud_backups.sql) ;;
              *) mv "$migration" /tmp/stk-post-roadmap2-migrations/ ;;
            esac
          done
          echo "Roadmap 2 baseline migrations:"
          ls -1 supabase/migrations
          echo "Roadmap 3/4 staged migrations:"
          ls -1 /tmp/stk-post-roadmap2-migrations
      - name: Select transient PostgreSQL port for isolated CI tests
        run: |
          # Supabase's default 54322 can be occupied on hosted runners.
          # This edit exists only in CI's disposable checkout, never in git.
          port=$((56000 + GITHUB_RUN_ID % 4000))
          printf '\n[db]\nport = %s\n' "$port" >> supabase/config.toml
          echo "Ephemeral local test PostgreSQL port: $port"
      - name: Start isolated Supabase at Roadmap 2 baseline
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Rebuild Roadmap 2 baseline
        run: supabase db reset
      - name: Restore Roadmap 3/4 migrations
        run: mv /tmp/stk-post-roadmap2-migrations/*.sql supabase/migrations/
      - name: Upgrade Roadmap 2 through Roadmap 4 incrementally
        run: supabase migration up --local
      - name: Run pgTAP after incremental upgrade
        run: supabase test db
      - name: Rebuild fresh database from all migrations
        run: supabase db reset
      - name: Run pgTAP after clean rebuild
        run: supabase test db
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  edge-functions:
    name: Edge Functions static check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: >-
          deno check
          supabase/functions/food-vision-ai/index.ts
          supabase/functions/web-push-test/index.ts

  mobile-tests:
    name: Mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build unapproved anatomical v2 candidates
        working-directory: apps/app_mobile
        run: python3 tool/build_anatomical_v2.py --output build/anatomical_v2
      - name: Generate skinned GLB v3 candidates (unapproved)
        working-directory: apps/app_mobile
        run: python3 tool/anatomical_3d/build_refined_anatomical_glb.py --output build/anatomical_3d_glb
      - name: Test glTF 2.0 rig, skinning and animation
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_anatomical_glb.py'
      - name: Test v3.2 anatomical mesh junctions and weighted deformation
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_refined_anatomical_glb.py'
      - name: Test GLB grip, stance and motion contacts
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_kinematic_contact.py'
      - name: Audit CC0 model staging rules without network
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_cc0_humanoid.py'
      - name: Install FFmpeg for experimental offline video QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Test H264 encoder from synthetic fixtures
        working-directory: apps/app_mobile
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 -m unittest discover -s tool/anatomical_3d -p 'test_video_comparison.py'
      - name: Download and hash-verify 53-bone CC0 source for QA
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/stage_cc0_humanoid.py
          --download --output build/cc0_model_stage
      - name: Generate neutral master human with 55-joint shoulder-girdle rig
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/build_master_character.py
          --input build/cc0_model_stage/human-base-rigged-cc0.glb
          --output build/cc0_master_character
      - name: Verify master rest-pose invariant, 11 muscle regions and separate scapular controls
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_master_character.py'
      - name: Generate 55-joint master v2 anatomical relief + eight inactive correctives
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/build_master_surface_v2.py
          --input build/cc0_master_character/stk_haven_master_55_unapproved.glb
          --output build/cc0_master_surface_v2
      - name: Audit master v2 mesh/rig parity, no face inversions, and 8 unilateral shape keys
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_master_surface_v2.py'
      - name: Generate seven master motion families with animated corrective morphs
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/build_master_motion_v3.py
          --input build/cc0_master_surface_v2/stk_haven_master_surface_v2_unapproved.glb
          --output build/cc0_master_motion_v3
      - name: Test master 55-joint motion library and glTF morph animation
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_master_motion_v3.py'
      - name: Generate optimized 55-joint mobile master with seven clips and eight morphs
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/build_master_mobile_v4.py
          --input build/cc0_master_motion_v3/stk_master_55_motion_lab_v3_unapproved.glb
          --output build/cc0_master_mobile_v4
      - name: Check v4 mobile LOD size and exact glTF motion/morph preservation
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_master_mobile_v4.py'
      - name: Build contact constrained master with separately animated overhead bar
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/build_master_contacts_v5.py
          --input build/cc0_master_mobile_v4/stk_master_v4_mobile_morph_lod_unapproved.glb
          --output build/cc0_master_contacts_v5
      - name: Validate 121 in-between frames with wrist and foot targets
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_master_contacts_v5.py'
      - name: Retarget three CC0 exercises to full GLB and mobile LOD
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/retarget_cc0_glb.py
          --input build/cc0_model_stage/human-base-rigged-cc0.glb
          --output build/cc0_53bone_retarget
      - name: Test 53-bone CC0 retargeting, provenance and skin weights
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_retarget_cc0.py'
      - name: Check distinct CC0 muscle regions and bilateral symmetry
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_muscle_region_atlas.py'
      - name: Audit bench support and three pose constraints at 81 samples
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_cc0_posture.py'
      - name: Check actual GLB linear interpolation and planted contacts at 30 FPS
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool/anatomical_3d -p 'test_cc0_interpolated_motion.py'
      - name: Test mobile
        working-directory: apps/app_mobile
        run: flutter test
      - name: Render 192 GLB video frames using Flutter QA
        working-directory: apps/app_mobile
        run: flutter test --dart-define=STK_CAPTURE_VIDEO_PILOTS=true test/features/exercises/anatomical_video_capture_test.dart
      - name: Encode three offline MP4 review candidates
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/encode_video_comparison.py
          --frames build/video_comparison/frames
          --glb build/anatomical_3d_glb
          --output build/video_comparison/mp4
      - name: Capture three REAL CC0 53-bone LOD cycles for MP4 comparison
        working-directory: apps/app_mobile
        run: flutter test --dart-define=STK_CAPTURE_CC0_VIDEO=true test/features/exercises/cc0_video_capture_test.dart
      - name: Encode the same 53-bone CC0 GLB animation as H264 MP4
        working-directory: apps/app_mobile
        run: >-
          python3 tool/anatomical_3d/encode_video_comparison.py
          --frames build/cc0_video_comparison/frames
          --glb build/cc0_53bone_retarget
          --glb-suffix _mobile_lod
          --source-label real_53_joint_CC0_humanoid_mobile_lod
          --output build/cc0_video_comparison/mp4
      - name: Test visual pilot geometry and reproducibility
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool -p 'test_visual_pilots.py'
      - name: Test anatomical v2 candidate generation
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool -p 'test_anatomical_v2.py'
      - name: Build visual pilot review viewer
        working-directory: apps/app_mobile
        run: python3 tool/build_visual_pilots.py --output build/visual_pilots
      - name: Upload visual pilot rendering evidence
        uses: actions/upload-artifact@v4
        with:
          name: stk-haven-visual-pilots
          path: |
            apps/app_mobile/build/visual_pilots/
            apps/app_mobile/build/visual_pilots_flutter/
            apps/app_mobile/build/anatomical_v2/
            apps/app_mobile/build/rigged_anatomy_flutter/
            apps/app_mobile/build/anatomical_3d_glb/
            apps/app_mobile/build/anatomical_glb_flutter/
            apps/app_mobile/build/video_comparison/mp4/
            apps/app_mobile/build/cc0_model_stage/
            apps/app_mobile/build/cc0_53bone_retarget/
            apps/app_mobile/build/cc0_master_character/
            apps/app_mobile/build/cc0_master_surface_v2/
            apps/app_mobile/build/cc0_master_motion_v3/
            apps/app_mobile/build/cc0_master_mobile_v4/
            apps/app_mobile/build/cc0_master_contacts_v5/
            apps/app_mobile/build/cc0_master_v4_flutter_qa/
            apps/app_mobile/build/cc0_flutter_review/
            apps/app_mobile/build/cc0_video_comparison/mp4/
          retention-days: 14
          if-no-files-found: error
      - name: Unit tests for offline Lottie reviewer
        working-directory: apps/app_mobile
        run: python3 -m unittest discover -s tool -p 'test_exercise_lottie_review.py'
      - name: Audit 229 drafts and create offline SVG review sheets
        working-directory: apps/app_mobile
        run: python3 tool/exercise_lottie_review.py --output build/lottie_review
      - name: Upload internal Lottie review evidence
        uses: actions/upload-artifact@v4
        with:
          name: stk-haven-lottie-review-229
          path: apps/app_mobile/build/lottie_review/
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      # Hosted Ubuntu includes toolchains unrelated to this Android build.
      # Gradle/Flutter can exhaust the workspace when debug, profile, release,
      # appbundle and split-ABI outputs are built in the same runner.
      - name: Reclaim Android runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          # Keep the Android SDK/NDK, Java and Flutter tooling intact.
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "Disk after cleanup:"
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Build debug APK
        working-directory: apps/app_mobile
        run: flutter build apk --debug --target lib/main_android.dart
      - name: Build profile APK
        working-directory: apps/app_mobile
        run: flutter build apk --profile --target lib/main_android.dart
      - name: Build release APK
        working-directory: apps/app_mobile
        run: flutter build apk --release --target lib/main_android.dart
      - name: Build release AAB
        working-directory: apps/app_mobile
        run: flutter build appbundle --release --target lib/main_android.dart
      - name: Build split ABI APKs
        working-directory: apps/app_mobile
        run: flutter build apk --release --split-per-abi --target lib/main_android.dart

  ios:
    name: iOS release + profile
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Install CocoaPods
        working-directory: apps/app_mobile/ios
        run: pod install
      - name: Build iOS profile without signing
        working-directory: apps/app_mobile
        run: flutter build ios --profile --no-codesign --target lib/main_ios.dart
      - name: Build iOS release without signing
        working-directory: apps/app_mobile
        run: flutter build ios --release --no-codesign --target lib/main_ios.dart
      - name: Package unsigned iOS IPA
        working-directory: apps/app_mobile
        run: |
          rm -rf build/ios_personal_test
          mkdir -p build/ios_personal_test/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios_personal_test/Payload/
          cd build/ios_personal_test
          /usr/bin/zip -qry STK-Haven-unsigned.ipa Payload
          shasum -a 256 STK-Haven-unsigned.ipa > STK-Haven-unsigned.ipa.sha256
      - name: Verify unsigned IPA structure and WidgetKit extension
        working-directory: apps/app_mobile
        shell: bash
        run: |
          set -euo pipefail
          IPA="build/ios_personal_test/STK-Haven-unsigned.ipa"
          APP="build/ios_personal_test/Payload/Runner.app"
          EXT="$APP/PlugIns/StkVerseWidget.appex"
          test -s "$IPA"
          unzip -tqq "$IPA"
          test -f "$APP/Info.plist"
          test -f "$EXT/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.FernandoSac.gymTracker" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")" = "com.FernandoSac.gymTracker.StkVerseWidget" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "com.apple.widgetkit-extension" ]
          EXPECTED_BUILD="$(sed -n 's/^version: .*+//p' pubspec.yaml)"
          test -n "$EXPECTED_BUILD"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$EXPECTED_BUILD" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT/Info.plist")" = "$EXPECTED_BUILD" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXT/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" ]
          unzip -Z1 "$IPA" | grep -F 'Payload/Runner.app/PlugIns/StkVerseWidget.appex/Info.plist'
          (cd build/ios_personal_test && shasum -a 256 -c STK-Haven-unsigned.ipa.sha256)
      - name: Upload unsigned iOS personal-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: stk-haven-ios-unsigned
          path: |
            apps/app_mobile/build/ios_personal_test/STK-Haven-unsigned.ipa
            apps/app_mobile/build/ios_personal_test/STK-Haven-unsigned.ipa.sha256
          retention-days: 7
          if-no-files-found: error

